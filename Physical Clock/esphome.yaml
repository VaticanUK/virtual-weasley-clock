          target: !lambda "return target_step;"

# --- HOMING / POSITION SENSORS (HALL EFFECT) ---
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO33
      inverted: true
      mode: INPUT_PULLUP
    id: home_sensor_2
    name: Home Sensor 2
    icon: "mdi:clock-in"

  - platform: gpio
    pin:
      number: GPIO35
      inverted: true
    id: home_sensor_3
    name: Home Sensor 3
    icon: "mdi:clock-in"

  - platform: gpio
    pin:
      number: GPIO32
      inverted: true
      mode: INPUT_PULLUP
    id: home_sensor_1
    name: Home Sensor 1
    icon: "mdi:clock-in"

  - platform: gpio
    pin:
      number: GPIO34
      inverted: true
    id: home_sensor_4
    name: Home Sensor 4
    icon: "mdi:clock-in"

# --- HOME ASSISTANT BUTTONS ---
button:
  - platform: template
    name: "Home All Clock Hands"
    id: button_home_clock
    icon: "mdi:home-clock-outline"
    on_press:
      then:
        - script.execute: home_all_hands

  - platform: template
    name: "Recalibrate All Hands (Keep Positions)"
    id: button_recalibrate_clock
    icon: "mdi:clock-check-outline"
    on_press:
      then:
        - script.execute: recalibrate_all_hands

  - platform: template
    name: "Home Motor 1"
    on_press:
      then:
        - script.execute: home_motor_1

  - platform: template
    name: "Home Motor 2"
    on_press:
      then:
        - script.execute: home_motor_2

  - platform: template
    name: "Home Motor 3"
    on_press:
      then:
        - script.execute: home_motor_3

  - platform: template
    name: "Home Motor 4"
    on_press:
      then:
        - script.execute: home_motor_4

# --- HOME ASSISTANT INTERFACE CONTROLS ---
number:
  - platform: template
    name: "Hand 1 Position (Steps)"
    id: hand_1_pos
    min_value: -30720
    max_value: 30720
    step: 1
    optimistic: true
    set_action:
      then:
        - logger.log:
            format: "Moving hand 1 to %.0f steps"
            args: [x]
        - script.execute:
            id: move_hand_1_precise
            target_step: !lambda "return (int)round(x);"
    icon: "mdi:clock-in"

  - platform: template
    name: "Hand 2 Position (Steps)"
    id: hand_2_pos
    min_value: -30720
    max_value: 30720
    step: 1
    optimistic: true
    set_action:
      then:
        - logger.log:
            format: "Moving hand 2 to %.0f steps"
            args: [x]
        - script.execute:
            id: move_hand_2_precise
            target_step: !lambda "return (int)round(x);"
    icon: "mdi:clock-in"

  - platform: template
    name: "Hand 3 Position (Steps)"
    id: hand_3_pos
    min_value: -30720
    max_value: 30720
    step: 1
    optimistic: true
    set_action:
      then:
        - logger.log:
            format: "Moving hand 3 to %.0f steps"
            args: [x]
        - script.execute:
            id: move_hand_3_precise
            target_step: !lambda "return (int)round(x);"
    icon: "mdi:clock-in"

  - platform: template
    name: "Hand 4 Position (Steps)"
    id: hand_4_pos
    min_value: -30720
    max_value: 30720
    step: 1
    optimistic: true
    set_action:
