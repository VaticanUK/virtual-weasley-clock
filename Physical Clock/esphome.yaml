# --- HOME ASSISTANT BUTTONS ---
button:
  - platform: template
    name: "Home All Clock Hands"
    id: button_home_clock
    icon: "mdi:home-clock-outline"
    on_press:
      then:
        - script.execute: home_all_hands
  
  - platform: template
    name: "Home Motor 1"
    on_press:
      then:
          - script.execute: home_motor_1

  - platform: template
    name: "Home Motor 2"
    on_press:
      then:
          - script.execute: home_motor_2

  - platform: template
    name: "Home Motor 3"
    on_press:
      then:
          - script.execute: home_motor_3

  - platform: template
    name: "Home Motor 4"
    on_press:
      then:
          - script.execute: home_motor_4
            
# --- HOME ASSISTANT INTERFACE CONTROLS ---
number:
  - platform: template
    name: "Hand 1 Position (Steps)"
    id: hand_1_pos
    min_value: -30720
    max_value: 30720
    step: 1
    optimistic: true
    set_action:
      then:
        - logger.log:
            format: "Moving hand 1 to %.0f steps"
            args: [x]
        - stepper.set_target:
            id: hand_1_stepper
            target: !lambda 'return x;'
    icon: "mdi:clock-in"
     
